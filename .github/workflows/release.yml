name: Publish CLI release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, ARM64, vulnotes-ci]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Build checksummed release archive
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning (for example v1.2.3)." >&2
            exit 1
          fi

          version="${tag#v}"
          configured_version=$(sed -n 's/^VERSION="\([^"]*\)"/\1/p' lib/config.sh)
          if [[ "$configured_version" != "$version" ]]; then
            echo "Tag $tag does not match VERSION=\"$configured_version\" in lib/config.sh." >&2
            exit 1
          fi

          archive="vulnotes-cli-${tag}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="vulnotes-cli-${version}/" \
            --output="$archive" \
            "$GITHUB_SHA"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "vulnotes-cli-${GITHUB_REF_NAME}.tar.gz" \
            "vulnotes-cli-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Vulnotes CLI ${GITHUB_REF_NAME}"
